# The router of a deployment.
#
# The router runs as a non-root user, with a read-only root filesystem and
# without a single capability. The upstream holds the two slots of the
# deployment; their weights are the traffic share of the new version.

worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /var/cache/nginx/client_temp 1 2;
    proxy_temp_path /var/cache/nginx/proxy_temp 1 2;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp 1 2;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp 1 2;
    scgi_temp_path /var/cache/nginx/scgi_temp 1 2;

    include /etc/nginx/conf.d/upstream.conf;
}
