# The deployment topology of a signed artifact.
#
# The router is nginx: it is the only component published on the host and it
# shifts the traffic between the two slots with the weights of its upstream.
# The application containers run as a non-root user, without capabilities,
# with a read-only root filesystem and without a single secret.
#
# The network of the deployment is its own: it is neither oracle-net nor the
# network of the sandbox.

name: ${DEPLOYMENT_PROJECT}

services:
  app-blue:
    image: ${BLUE_IMAGE}
    container_name: ${BLUE_CONTAINER}
    environment:
      ORACLE_SERVICE_NAME: "${BLUE_NAME}"
      ORACLE_SERVICE_VERSION: "${BLUE_VERSION}"
      ORACLE_ROOT_HASH: "${BLUE_ROOT_HASH}"
      ORACLE_SERVICE_FILES: "${BLUE_FILES}"
      ORACLE_SERVICE_MODULES: "${BLUE_MODULES}"
      ORACLE_SERVICE_PORT: "8080"
    networks:
      - deploy-net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    restart: "no"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 2s

  app-green:
    image: ${GREEN_IMAGE}
    container_name: ${GREEN_CONTAINER}
    environment:
      ORACLE_SERVICE_NAME: "${GREEN_NAME}"
      ORACLE_SERVICE_VERSION: "${GREEN_VERSION}"
      ORACLE_ROOT_HASH: "${GREEN_ROOT_HASH}"
      ORACLE_SERVICE_FILES: "${GREEN_FILES}"
      ORACLE_SERVICE_MODULES: "${GREEN_MODULES}"
      ORACLE_SERVICE_PORT: "8080"
    networks:
      - deploy-net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    restart: "no"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 2s

  router:
    image: ${ROUTER_IMAGE}
    container_name: ${ROUTER_CONTAINER}
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    volumes:
      - "${DEPLOY_DIR}/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "${DEPLOY_DIR}/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro"
    networks:
      - deploy-net
    ports:
      - "127.0.0.1:${ROUTER_PORT}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,mode=1777
      - /var/run:rw,noexec,nosuid,size=4m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "101:101"
    restart: "no"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

networks:
  deploy-net:
    name: ${NETWORK_NAME}
    driver: bridge
